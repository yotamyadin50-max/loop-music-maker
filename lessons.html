<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>שיעורים, פעימה</title>
  <meta name="description" content="חמישה שיעורים קצרים שמלמדים אותך לבנות קצב: תראה, תחזור על זה בעצמך, ואז תוסיף ללופ אמיתי." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F1115'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23F5C24C'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600&family=Space+Grotesk:wght@500&subset=hebrew&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="lessons">
  <header class="site-header">
    <a class="site-header__logo" href="index.html">פעימה</a>
    <nav class="site-header__nav">
      <a class="site-header__link" href="index.html">בית</a>
      <a class="site-header__link" href="studio.html">סטודיו</a>
      <a class="site-header__link" href="lessons.html">שיעורים</a>
      <a class="site-header__link" href="my-loops.html">הלופים שלי</a>
    </nav>
  </header>

  <main class="app-shell lessons" data-lessons>
    <div class="lessons__picker" data-lesson-picker></div>

    <section class="lesson-card">
      <div class="lesson-card__head">
        <h1 data-lesson-title></h1>
        <div class="lesson-card__difficulty" data-lesson-difficulty aria-hidden="true"></div>
      </div>
      <p class="lesson-card__desc" data-lesson-desc></p>

      <div class="lesson-card__demo">
        <button type="button" class="btn btn--outline" data-action="demo">🔊 השמע</button>
        <label class="slow-toggle">
          <input type="checkbox" data-slow-toggle />
          לאט
        </label>
        <span class="lesson-card__hint">תקשיב ותסתכל אילו פדים נדלקים</span>
        <span class="beat-counter" data-beat-counter aria-hidden="true"></span>
      </div>

      <div class="pad-grid" data-lesson-grid></div>

      <div class="lesson-card__practice">
        <p data-practice-status>עכשיו התור שלך: תקיש על אותם פדים, באותו סדר.</p>
        <p class="lesson-card__count">חזרות מוצלחות: <span data-repeat-count>0</span></p>
      </div>

      <div class="lesson-card__reward" data-reward hidden>
        <p>מעולה, תפסת את הקצב! אפשר להוסיף את זה ללופ אמיתי.</p>
        <div class="lesson-card__reward-actions">
          <button type="button" class="btn btn--accent" data-action="add-to-loop">מוסיפים ללופ</button>
          <a class="btn btn--outline" data-action="open-studio" href="studio.html" hidden>פתח בסטודיו</a>
        </div>
      </div>

      <nav class="lesson-card__nav">
        <button type="button" class="btn btn--outline" data-action="prev">שיעור קודם</button>
        <button type="button" class="btn btn--outline" data-action="next">שיעור הבא</button>
      </nav>
    </section>
  </main>

  <div class="block-screen">
    <span class="block-screen__logo">פעימה</span>
    <p class="block-screen__text">הכלי הזה בנוי לשימוש בטאבלט או מחשב, המסך שלך צר מדי כרגע.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
